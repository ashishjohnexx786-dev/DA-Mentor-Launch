name: Final visible name cleanup
on:
  push:
    paths:
      - '.github/workflows/final-visible-name-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible legacy Launch names
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js'); s=p.read_text()
          s=s.replace("product:'DA Mentor OS'","product:'DA Mentor Launch'")
          s=s.replace('DA Mentor v4 backup restored.','DA Mentor Launch backup restored.')
          s=s.replace('da-mentor-v4-backup-','DA_Mentor_Launch_Backup_')
          s=s.replace('Reset ALL DA Mentor v4 data on this device?','Reset ALL DA Mentor Launch data on this device?')
          p.write_text(s)
          p=Path('service-worker.js'); s=p.read_text(); s=re.sub(r'da-mentor-launch-v5\.\d+','da-mentor-launch-v5.3',s); p.write_text(s)
          PY
          grep -q "product:'DA Mentor Launch'" app.js
      - name: Commit
        run: |
          git config user.name 'DA Mentor Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js service-worker.js
          git diff --cached --quiet || git commit -m 'Remove visible legacy Launch names'
          git push
