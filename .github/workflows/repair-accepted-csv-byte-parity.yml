              got=hashlib.sha256(crlf).hexdigest()
              if got != want: raise SystemExit(f'{rel}: expected {want}, got {got}')
              p.write_bytes(crlf)
          a=Path('.gitattributes'); lines=a.read_text().splitlines() if a.exists() else []
          if '*.csv -text' not in lines: lines.append('*.csv -text')
          a.write_text('\n'.join(lines)+'\n')
