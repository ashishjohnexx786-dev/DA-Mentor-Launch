name: Repair accepted CSV byte parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-accepted-csv-byte-parity.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore accepted CRLF CSV bytes
