          git config user.name 'five-course-runtime-parity'
          git config user.email 'actions@users.noreply.github.com'
          git add .gitattributes
          git add -A -- '*.csv'
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Restore accepted C1 CSV bytes for hosted parity'
          git push origin HEAD:main
