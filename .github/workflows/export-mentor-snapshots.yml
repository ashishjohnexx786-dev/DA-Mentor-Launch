name: Export current Mentor snapshots
on:
  push:
    branches: [qa-export-20260826]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect current public Mentor repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports
          git clone --depth 1 --branch main https://github.com/ashishjohnexx786-dev/DA-Mentor-Launch.git exports/DA-Mentor-Launch
          git clone --depth 1 --branch main https://github.com/ashishjohnexx786-dev/DA-Mentor-Advance.git exports/DA-Mentor-Advance
          git clone --depth 1 --branch main https://github.com/ashishjohnexx786-dev/DA-Mentor-Bridge.git exports/DA-Mentor-Bridge
          git clone --depth 1 --branch main https://github.com/ashishjohnexx786-dev/DA-Mentor-Engineering.git exports/DA-Mentor-Engineering
          find exports -type d -name .git -prune -exec rm -rf {} +
      - name: Upload snapshot bundle
        uses: actions/upload-artifact@v4
        with:
          name: mentor-live-snapshots
          path: exports
          if-no-files-found: error
          retention-days: 1
